<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ansab-theme");
          if (t !== "day" && t !== "night") t = "night";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t === "day" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Ansab Rehman — Full Stack Engineer building scalable web apps and AI-powered products. Python, Django, React, FastAPI, RAG, and production systems."
    />
    <meta name="author" content="Ansab Rehman" />
    <meta name="theme-color" content="#0C0D0F" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ansab Rehman — Full Stack Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Ansab Rehman: scalable backends, thoughtful frontends, and AI systems that ship."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ansab Rehman — Full Stack Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ansab Rehman: scalable backends, thoughtful frontends, and AI systems that ship."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"

    />

    <title>Ansab Rehman — Full Stack Engineer</title>
  </head>

</html>
